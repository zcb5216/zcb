<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>✨梦幻画猜·AI一夏✨</title>
<style>
*{box-sizing:border-box;user-select:none} body{margin:0;min-height:100vh;font-family:'Segoe UI','Quicksand',system-ui,'Microsoft YaHei',sans-serif;color:#2c1e3f;background:radial-gradient(ellipse at 20% 30%,#f9e6ff,#cfb3ff);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(circle at 15% 40%,rgba(255,220,240,.5) 2%,transparent 3%),radial-gradient(circle at 85% 70%,rgba(180,220,255,.5) 1.5%,transparent 2.5%),repeating-linear-gradient(45deg,rgba(255,255,200,.08) 0,rgba(255,255,200,.08) 2px,transparent 2px,transparent 8px);pointer-events:none}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}.floating-particle{position:fixed;pointer-events:none;background:radial-gradient(circle,#fff9c4,#ffd0f0);border-radius:50%;opacity:.5;animation:floatAround 12s infinite alternate ease-in-out}
@keyframes floatAround{0%{transform:translateY(0) translateX(0) scale(1);opacity:.2}100%{transform:translateY(-40px) translateX(25px) scale(1.2);opacity:.7}}
.welcome{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,rgba(130,90,220,.75),rgba(255,130,180,.6));backdrop-filter:blur(10px)}
.welcome.hidden{display:none}.welcome-card{max-width:760px;width:100%;background:linear-gradient(145deg,#fff8fe,#eef7ff);border-radius:36px;padding:26px;border:2px solid #ffd5f0;box-shadow:0 30px 60px rgba(0,0,0,.25);text-align:center;position:relative;overflow:hidden}
.welcome-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,#ffe4f533 0 22%,transparent 23%),radial-gradient(circle at 82% 70%,#d9efff55 0 18%,transparent 19%)}
.w-title{position:relative;font-size:42px;font-weight:900;background:linear-gradient(135deg,#ff67a8,#8f69ff);-webkit-background-clip:text;color:transparent}.w-sub{position:relative;font-size:18px;margin:8px 0 14px}
.gif-row{position:relative;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px}.gif-chip{font-size:44px;background:#fff;border:1px solid #ffd7ea;border-radius:18px;padding:8px 12px;animation:bob 1.8s infinite alternate}
.gif-chip:nth-child(2){animation-delay:.4s}.gif-chip:nth-child(3){animation-delay:.8s}.gif-chip:nth-child(4){animation-delay:1.2s}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.enter-btn{position:relative;border:none;border-radius:40px;padding:14px 28px;font-weight:900;font-size:18px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7a8cff,#ff6fb1);box-shadow:0 10px 20px rgba(130,90,220,.3)}
.wrap{max-width:1300px;margin:16px auto;padding:0 18px;position:relative;z-index:2}
.top{background:rgba(255,245,255,.8);backdrop-filter:blur(12px);border-radius:48px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border:1px solid rgba(255,255,240,.8);box-shadow:0 15px 35px rgba(156,100,200,.2),inset 0 1px 0 rgba(255,255,255,.7)}
.title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#ff7eb3,#ff758c,#c779ff);-webkit-background-clip:text;color:transparent}
.chips{display:flex;gap:12px;flex-wrap:wrap}.chip{background:rgba(255,250,245,.95);border-radius:100px;padding:8px 18px;font-weight:900;font-size:1rem;color:#5b3d6e;border:1px solid rgba(255,200,230,.75);box-shadow:0 4px 10px rgba(0,0,0,.06)}.chip b{font-size:1.28rem;margin:0 4px}.team-chip{background:linear-gradient(135deg,#ffe6f2,#f2e8ff)}.timer-chip{background:linear-gradient(135deg,#fff2bf,#ffd37a);box-shadow:0 0 0 2px #fff inset,0 0 14px #ffca4a66}.score-chip{background:linear-gradient(135deg,#ffd9ea,#dfeaff);box-shadow:0 0 0 2px #fff inset}
#turnTeam.red-team{color:#ff4d6d}#turnTeam.blue-team{color:#4d6dff}
.main{margin-top:20px;display:grid;grid-template-columns:300px 1fr;gap:18px}.left-panel,.draw{background:rgba(255,248,255,.75);backdrop-filter:blur(8px);border-radius:32px;border:1px solid rgba(255,220,250,.7);padding:18px 12px;box-shadow:0 20px 35px rgba(0,0,0,.1)}
.lbtn{width:100%;border:none;border-radius:40px;padding:10px 0;font-weight:800;font-size:.9rem;cursor:pointer;color:#fff;position:relative;overflow:hidden}.lbtn.active{box-shadow:0 0 0 3px #fff,0 0 0 6px #ff80bf}
.btn1{background:linear-gradient(135deg,#a67cff,#7856e0)}.btn2{background:linear-gradient(135deg,#ff85b3,#ff567d)}.btn3{background:linear-gradient(135deg,#4cdbcb,#2ba991)}.btn4{background:linear-gradient(135deg,#ffb347,#ff8c1a)}.btn5{background:linear-gradient(135deg,#bf9eff,#986dff)}.btn6{background:linear-gradient(135deg,#6dc1ff,#3d93e0)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.status{background:rgba(245,235,255,.85);border-radius:28px;padding:12px;font-weight:600;margin:16px 0;border-left:5px solid #ffb1d9}
.left-decor{text-align:center;background:radial-gradient(circle at 30% 20%,#fff0f9,#ffe5f5);border-radius:48px;padding:16px;margin-top:12px}
.draw{padding:18px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}.tool-btn,.dot{border-radius:40px!important;background:white;border:1px solid #e1c6ff;padding:8px 14px;font-weight:bold;cursor:pointer;transition:.1s}.tool-btn.active,.dot.active{box-shadow:0 0 0 3px #fff,0 0 0 5px #b77eff;transform:scale(.98)}.tool-btn.fx-pop{animation:tbPop .28s ease}@keyframes tbPop{0%{transform:scale(.92)}70%{transform:scale(1.06)}100%{transform:scale(.98)}}
.dot{width:42px;height:42px;border-radius:50%}.eraser-size{display:inline-flex;background:rgba(255,225,240,.9);border-radius:30px;padding:5px 12px;align-items:center;gap:8px;margin:8px 0}
.canvas-wrap{background:white;border-radius:24px;box-shadow:0 15px 30px rgba(0,0,0,.15);padding:10px;position:relative}canvas{display:block;width:100%;height:auto;background:white;border-radius:16px;touch-action:none}.cursor-tag{position:absolute;top:18px;right:24px;background:rgba(0,0,0,.6);color:#ffe3f6;padding:4px 12px;border-radius:60px;font-weight:bold;z-index:10;font-size:13px}
.timer-warning{animation:timerPulse 1s infinite;background:#ff6982;color:white;padding:0 6px;border-radius:30px}.timer-jump{display:inline-block;animation:timerJump .22s ease}@keyframes timerPulse{0%{opacity:1}100%{opacity:.7}}@keyframes timerJump{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.mask{position:fixed;inset:0;background:rgba(46,21,67,.7);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000}.mask.show{display:flex}.modal{background:linear-gradient(145deg,#fff7fb,#ffeef5);border-radius:70px;padding:32px 40px;max-width:500px;text-align:center;border:2px solid rgba(255,210,240,.8)}.word{font-size:64px;font-weight:900;background:linear-gradient(135deg,#ff758c,#ffa751);-webkit-background-clip:text;color:transparent}
@media (max-width:800px){.main{grid-template-columns:1fr}.top{flex-direction:column;align-items:stretch}.tools{justify-content:center}.w-title{font-size:32px}}
</style>
</head>
<body>
<div id="particles"></div>
<div id="welcome" class="welcome">
  <div class="welcome-card">
    <div class="w-title">✨ 欢迎来到梦幻画猜 · AI一夏 ✨</div>
    <div class="w-sub">先看词、再作画、一起猜！准备好进入超可爱挑战了吗？</div>
    <div class="gif-row"><div class="gif-chip">🤖</div><div class="gif-chip">🦄</div><div class="gif-chip">🎨</div><div class="gif-chip">🌈</div></div>
    <button id="enterGame" class="enter-btn">进入游戏</button>
  </div>
</div>
<div class="wrap">
<div class="top"><div class="title">🦋 梦幻画猜 · AI一夏 🧚‍♀️</div><div class="chips"><div class="chip">🎲 轮次 <b id="round">1</b>/6</div><div class="chip team-chip">🎨 队伍 <b id="turnTeam">红队</b></div><div class="chip timer-chip">⏳ 倒计时 <b id="timer">45</b>s</div><div class="chip score-chip">🔴 <span id="scoreA">0</span>  :  🔵 <span id="scoreB">0</span></div></div></div>
<div class="main">
<aside class="left-panel"><button class="lbtn btn1" id="showWord">✨ 给小画家看词（10秒）✨</button><div class="btns"><button class="lbtn btn2" id="start">▶ 开始作画</button><button class="lbtn btn3" id="pause">⏸ 暂停</button><button class="lbtn btn4" id="correct">🎉 猜对 +10</button><button class="lbtn btn5" id="nextRound">➡ 下一轮</button></div><div class="btns"><button class="lbtn btn6" id="newWord">🔄 换词</button><button class="lbtn btn2" id="reset">🧹 重置游戏</button></div><div class="status" id="status">🌟 欢迎来到梦幻画猜！先点“给小画家看词”，再开始作画～</div><div class="status">🎭 词语状态：<b id="wordMasked">🔒 已隐藏</b></div><div class="left-decor"><div style="font-size:44px">🌈 🎠 🦄</div><div>✨ 画出心中童话 ✨</div></div></aside>
<section class="draw"><div class="tools"><button class="tool-btn btn1" id="thin">✏️ 细笔</button><button class="tool-btn btn5" id="thick">🖍️ 粗笔</button><button class="tool-btn btn4" id="eraser">🧽 橡皮</button><button class="btn6" id="undo">↩️ 撤销</button><button class="btn2" id="clear">🗑 清空</button><div style="display:flex;gap:6px;flex-wrap:wrap"><div class="dot" data-c="#2d2d2d" style="background:#2d2d2d"></div><div class="dot" data-c="#ff5d8f" style="background:#ff5d8f"></div><div class="dot" data-c="#5a8dff" style="background:#5a8dff"></div><div class="dot" data-c="#2ec4b6" style="background:#2ec4b6"></div><div class="dot" data-c="#ff9f1c" style="background:#ff9f1c"></div><div class="dot" data-c="#8f7bff" style="background:#8f7bff"></div><div class="dot" data-c="#00c853" style="background:#00c853"></div><div class="dot" data-c="#ffd600" style="background:#ffd600"></div><div class="dot" data-c="#ff1744" style="background:#ff1744"></div><div class="dot" data-c="#00b0ff" style="background:#00b0ff"></div></div></div>
<div class="eraser-size" id="eraserSizeWrap"><span>🧽 橡皮大小</span><input id="eraserSize" type="range" min="8" max="60" step="2" value="18" /><b id="eraserSizeLabel">18</b></div>
<div class="canvas-wrap"><div class="cursor-tag" id="cursorTag">当前：✏️ 细笔</div><div class="preview" id="eraserPreview" style="position:absolute;border:2px dashed #ffb3d9;border-radius:50%;pointer-events:none;display:none;background:rgba(255,200,230,.3)"></div><canvas id="board" width="1100" height="700" style="width:100%; height:auto; max-width:1100px; aspect-ratio:1100/700"></canvas></div>
</section></div></div>
<div class="mask" id="mask"><div class="modal"><h2>🎨 小画家专享 🎨</h2><div class="word" id="word">太阳</div><div id="tip">✨ 提示：发光发热 ✨</div><p><span id="count">⏰ 10 秒后自动隐藏</span></p></div></div>
<script>
const words=[{w:'太阳',t:'暖洋洋，金灿灿，天上唯一'},{w:'月亮',t:'夜晚弯弯像小船'},{w:'星星',t:'夜空闪烁小眼睛'},{w:'彩虹',t:'雨后七彩桥'},{w:'独角兽',t:'梦幻神兽有角'},{w:'冰淇淋',t:'夏天冰凉甜品'},{w:'西瓜',t:'绿皮红瓤解暑'},{w:'猫咪',t:'喵喵叫，毛茸茸'},{w:'狗狗',t:'人类好朋友汪汪'},{w:'蝴蝶',t:'会飞的花'},{w:'机器人',t:'金属智能'},{w:'城堡',t:'公主王子住里面'}];
let round=1,maxRound=6,team=0,score=[0,0],left=45,timerInt=null,currentWordIdx=0,drawing=false,color='#2d2d2d',size=4,tool='thin',eraserSize=18,history=[],maskTimer=null;
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),previewDiv=document.getElementById('eraserPreview');
const $=id=>document.getElementById(id); const roundEl=$('round'),turnTeam=$('turnTeam'),timerEl=$('timer'),scoreA=$('scoreA'),scoreB=$('scoreB'),statusEl=$('status'),wordEl=$('word'),tipEl=$('tip'),wordMasked=$('wordMasked'),cursorTag=$('cursorTag');
const penCursor='url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'28\' height=\'28\'><text x=\'2\' y=\'22\' font-size=\'22\'>✏️</text></svg>") 2 22, crosshair';
const brushCursor='url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'28\' height=\'28\'><text x=\'2\' y=\'22\' font-size=\'22\'>🖍️</text></svg>") 2 22, crosshair';
const eraserCursor='url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'28\' height=\'28\'><text x=\'2\' y=\'22\' font-size=\'22\'>🧽</text></svg>") 4 22, cell';
function activateLeftButton(id){document.querySelectorAll('.lbtn').forEach(btn=>btn.classList.remove('active'));$(id)?.classList.add('active')}
function activateToolButton(id){document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active','fx-pop'));const el=$(id);if(el){el.classList.add('active','fx-pop');setTimeout(()=>el.classList.remove('fx-pop'),300)}}
function syncCursor(){if(tool==='eraser')canvas.style.cursor=eraserCursor;else canvas.style.cursor=(tool==='thick'?brushCursor:penCursor)}
function pickRandomWord(){currentWordIdx=Math.floor(Math.random()*words.length);wordEl.textContent=words[currentWordIdx].w;tipEl.innerHTML='✨ 提示：'+words[currentWordIdx].t+' ✨';wordMasked.textContent='❓ 隐藏中'}
function setTeamUI(){turnTeam.textContent=team===0?'红队':'蓝队';turnTeam.classList.toggle('red-team',team===0);turnTeam.classList.toggle('blue-team',team===1)}
function updateScoresUI(){scoreA.textContent=score[0];scoreB.textContent=score[1]}
function tick(){if(left<=0){pauseTimer();statusEl.innerHTML='⏰ 时间到啦！请点击“下一轮” ✨';timerEl.classList.add('timer-warning');return;}left--;timerEl.textContent=left;timerEl.classList.remove('timer-jump');void timerEl.offsetWidth;timerEl.classList.add('timer-jump');if(left<=10)timerEl.classList.add('timer-warning');else timerEl.classList.remove('timer-warning')}
function startTimer(){if(timerInt)return;timerInt=setInterval(tick,1000);statusEl.innerHTML='🎨 尽情绘画吧～ 🎨'} function pauseTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;statusEl.innerHTML='⏸ 暂停中，点击开始继续'}}
function showWordMask(seconds=10){if(maskTimer){clearTimeout(maskTimer);maskTimer=null;}const mask=$('mask'),count=$('count');mask.classList.add('show');let remaining=seconds;const update=()=>count.innerHTML=`⏰ ${remaining} 秒后自动隐藏`;update();const step=()=>{remaining--;if(remaining<=0){mask.classList.remove('show');maskTimer=null;return;}update();maskTimer=setTimeout(step,1000)};maskTimer=setTimeout(step,1000)}
function saveState(){history.push(canvas.toDataURL());if(history.length>30)history.shift()} function restoreState(imgData){const img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0)};img.src=imgData}
function getCoords(e){const rect=canvas.getBoundingClientRect();const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;const p=e.touches?e.touches[0]:e;let x=(p.clientX-rect.left)*scaleX,y=(p.clientY-rect.top)*scaleY;x=Math.min(Math.max(0,x),canvas.width);y=Math.min(Math.max(0,y),canvas.height);return{x,y,clientX:p.clientX,clientY:p.clientY}}
function startDraw(e){e.preventDefault();drawing=true;const p=getCoords(e);saveState();ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=color;ctx.lineWidth=size}
function drawMove(e){if(!drawing)return;const p=getCoords(e);if(tool==='eraser'){previewDiv.style.display='block';const rect=canvas.getBoundingClientRect();previewDiv.style.width=eraserSize+'px';previewDiv.style.height=eraserSize+'px';previewDiv.style.left=(p.clientX-rect.left-eraserSize/2)+'px';previewDiv.style.top=(p.clientY-rect.top-eraserSize/2)+'px';ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,eraserSize/2,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';return;}ctx.globalCompositeOperation='source-over';ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)}
function endDraw(){drawing=false;previewDiv.style.display='none'}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',drawMove);window.addEventListener('mouseup',endDraw);canvas.addEventListener('touchstart',startDraw,{passive:false});canvas.addEventListener('touchmove',drawMove,{passive:false});window.addEventListener('touchend',endDraw);
$('showWord').onclick=()=>{activateLeftButton('showWord');showWordMask(10)};$('start').onclick=()=>{activateLeftButton('start');startTimer()};$('pause').onclick=()=>{activateLeftButton('pause');pauseTimer()};$('correct').onclick=()=>{activateLeftButton('correct');score[team]+=10;updateScoresUI();statusEl.innerHTML='🎉 猜对啦！ +10分 🎉🎉';pickRandomWord();wordMasked.textContent='❓ 已隐藏新词';};$('nextRound').onclick=()=>{activateLeftButton('nextRound');pauseTimer();round++;if(round>maxRound){statusEl.innerHTML=`🏆 游戏结束！红队 ${score[0]} : ${score[1]} 蓝队 🏆`;return;}team=1-team;left=45;timerEl.textContent=left;roundEl.textContent=round;setTeamUI();pickRandomWord();statusEl.innerHTML=`✨ 第${round}轮，${team===0?'红队':'蓝队'} 作画，先看词再开始 ✨`;ctx.clearRect(0,0,canvas.width,canvas.height);history=[];};$('newWord').onclick=()=>{activateLeftButton('newWord');pickRandomWord();statusEl.innerHTML='🔄 换词成功（新词仅小画家可见）';wordMasked.textContent='❓ 新词语已隐藏';};$('reset').onclick=()=>{activateLeftButton('reset');pauseTimer();round=1;team=0;score=[0,0];left=45;roundEl.textContent=1;timerEl.textContent=45;updateScoresUI();setTeamUI();pickRandomWord();ctx.clearRect(0,0,canvas.width,canvas.height);history=[];statusEl.innerHTML='✨ 游戏已重置，开始梦幻之旅 ✨';timerEl.classList.remove('timer-warning');};
$('thin').onclick=()=>{tool='thin';size=3;cursorTag.innerText='当前：✏️ 细笔';activateToolButton('thin');syncCursor();};$('thick').onclick=()=>{tool='thick';size=9;cursorTag.innerText='当前：🖍️ 粗笔';activateToolButton('thick');syncCursor();};$('eraser').onclick=()=>{tool='eraser';size=eraserSize;cursorTag.innerText='当前：🧽 橡皮擦';activateToolButton('eraser');syncCursor();};$('eraserSize').oninput=e=>{eraserSize=parseInt(e.target.value);$('eraserSizeLabel').innerText=eraserSize;if(tool==='eraser')size=eraserSize;};$('undo').onclick=()=>{if(history.length)restoreState(history.pop())};$('clear').onclick=()=>{saveState();ctx.clearRect(0,0,canvas.width,canvas.height)};
document.querySelectorAll('.dot').forEach(btn=>{btn.onclick=()=>{if(tool==='eraser'){tool='thin';size=3;cursorTag.innerText='当前：✏️ 细笔';activateToolButton('thin');}color=btn.dataset.c;document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));btn.classList.add('active');syncCursor();};});
$('enterGame').onclick=()=>{$('welcome').classList.add('hidden')};
function createParticles(){const container=document.getElementById('particles');for(let i=0;i<40;i++){const d=document.createElement('div');d.className='floating-particle';const sz=Math.random()*8+3;d.style.width=sz+'px';d.style.height=sz+'px';d.style.left=Math.random()*100+'%';d.style.bottom=Math.random()*100+'%';d.style.animationDuration=Math.random()*12+5+'s';d.style.animationDelay=Math.random()*5+'s';container.appendChild(d)}}
pickRandomWord();setTeamUI();updateScoresUI();document.querySelector('.dot[data-c="#2d2d2d"]').classList.add('active');activateLeftButton('showWord');activateToolButton('thin');syncCursor();createParticles();
</script>
</body>
</html>
