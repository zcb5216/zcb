<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI一夏 超好玩｜欢乐版你画我猜</title>
<style>
  :root{--bg:#f6f9ff;--card:#fff;--ink:#1f3152;--accent:#5b86ff;--ok:#18a06f;--warn:#ff9f43}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:18px auto;padding:0 14px}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(30,68,130,.1)}
  h1{margin:0 0 8px;font-size:30px}.desc{margin:0 0 12px;line-height:1.7}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#e8efff;border-radius:999px;padding:8px 14px;font-weight:700}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.team{background:#f3f6ff;border-radius:12px;padding:12px}
  .team h3{margin:0 0 8px}.score{font-size:26px;font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-size:18px;cursor:pointer}
  .primary{background:var(--accent);color:#fff}.ghost{background:#eef2ff}.good{background:#dcf6ea}.warn{background:#ffe9d3}
  .prompt{margin-top:10px;background:#fff7e8;border:2px dashed #ffc66f;border-radius:14px;padding:14px;text-align:center}
  .word{font-size:42px;font-weight:900;letter-spacing:2px}.tip{margin-top:8px;font-size:18px;color:#4a5f84}
  .timer{font-size:36px;font-weight:900}.mini{font-size:14px;color:#5870a0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  @media (max-width:760px){.teams{grid-template-columns:1fr}.word{font-size:34px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>🎉 AI 欢乐你画我猜（全班互动版）</h1>
  <p class="desc">玩法：分成红蓝两队。每轮1位“小画家”抽词并画图（不能写字），同队同学抢答。答对加分！6轮后总分高者获胜。</p>

  <div class="row">
    <div class="pill">轮次：<span id="round">1</span>/6</div>
    <div class="pill">当前队伍：<span id="turnTeam">红队</span></div>
    <div class="pill">倒计时：<span id="timer" class="timer">45</span>s</div>
  </div>

  <div class="teams">
    <div class="team"><h3>🔴 红队</h3><div class="score" id="scoreA">0</div></div>
    <div class="team"><h3>🔵 蓝队</h3><div class="score" id="scoreB">0</div></div>
  </div>

  <div class="prompt">
    <div class="mini">给“小画家”看的词（可点击换词）</div>
    <div class="word" id="word">机器人老师</div>
    <div class="tip" id="tip">提示：上课、讲台、AI</div>
    <div class="grid">
      <button class="btn ghost" id="newWord">🔄 换一个词</button>
      <button class="btn primary" id="start">▶️ 开始本轮</button>
      <button class="btn ghost" id="pause">⏸️ 暂停</button>
    </div>
  </div>

  <div class="row" style="margin-top:12px">
    <button class="btn good" id="correct">✅ 猜对了（+10）</button>
    <button class="btn warn" id="skip">⏭️ 跳过（不加分）</button>
    <button class="btn ghost" id="nextRound">➡️ 下一轮（换队）</button>
    <button class="btn ghost" id="reset">🔁 重置整局</button>
  </div>

  <p id="status" class="desc" style="margin-top:10px;font-weight:700">准备就绪：请先让本轮小画家看词，再点击“开始本轮”。</p>
</div></div>

<script>
const words=[
  {w:'机器人老师',t:'上课、讲台、AI'},
  {w:'会说话的书包',t:'书本、声音、智能'},
  {w:'AI画画助手',t:'画笔、屏幕、颜色'},
  {w:'垃圾分类机器人',t:'回收桶、环保、机械手'},
  {w:'会跳舞的无人机',t:'天空、旋转、灯光'},
  {w:'未来智能教室',t:'黑板、平板、语音'},
  {w:'AI天气播报员',t:'太阳云朵、话筒'},
  {w:'会巡逻的机器狗',t:'四条腿、校园、安全'},
  {w:'魔法翻译耳机',t:'耳机、语言、对话'},
  {w:'AI音乐小乐队',t:'音符、乐器、节奏'}
];
let round=1,maxRound=6,team=0,score=[0,0],left=45,timer=null,current=0;
const roundEl=doc('round'),turnTeam=doc('turnTeam'),timerEl=doc('timer'),scoreA=doc('scoreA'),scoreB=doc('scoreB');
const wordEl=doc('word'),tipEl=doc('tip'),statusEl=doc('status');
function doc(id){return document.getElementById(id)}
function renderWord(){const o=words[current];wordEl.textContent=o.w;tipEl.textContent='提示：'+o.t}
function pickWord(){current=Math.floor(Math.random()*words.length);renderWord();}
function setTeam(){turnTeam.textContent=team===0?'红队':'蓝队'}
function tick(){left--;timerEl.textContent=left;if(left<=0){stop();statusEl.textContent='⏰ 时间到！请点击“下一轮（换队）”。';}}
function start(){if(timer) return;statusEl.textContent='开始作画！同队同学快抢答～';timer=setInterval(tick,1000)}
function stop(){clearInterval(timer);timer=null}
function addScore(){score[team]+=10;updateScore();statusEl.textContent='太棒了！本轮猜对 +10 分。可继续画下一个词或下一轮。';pickWord();}
function updateScore(){scoreA.textContent=score[0];scoreB.textContent=score[1]}
function nextRound(){stop();round++;if(round>maxRound){endGame();return;} team=1-team;left=45;timerEl.textContent=left;roundEl.textContent=round;setTeam();pickWord();statusEl.textContent='换队完成！先让新小画家看词，再开始本轮。';}
function skipWord(){pickWord();statusEl.textContent='已跳过，换新词继续！';}
function resetAll(){stop();round=1;team=0;score=[0,0];left=45;roundEl.textContent=1;timerEl.textContent=45;setTeam();updateScore();pickWord();statusEl.textContent='已重置，重新开始欢乐对战！';}
function endGame(){stop();let msg='平局！两队都超棒！';if(score[0]>score[1]) msg='🎊 红队获胜！';if(score[1]>score[0]) msg='🎊 蓝队获胜！';statusEl.textContent=`游戏结束：${msg}（红队 ${score[0]} : 蓝队 ${score[1]}）`}

doc('newWord').onclick=pickWord; doc('start').onclick=start; doc('pause').onclick=stop;
doc('correct').onclick=addScore; doc('skip').onclick=skipWord; doc('nextRound').onclick=nextRound; doc('reset').onclick=resetAll;
setTeam();updateScore();pickWord();
</script>
</body>
</html>
